[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-flow"
version = "0.1.0"
description = "Quantitative strategy research and backtesting"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "yfinance",
    "matplotlib",
    "openpyxl",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_flow*"]
exclude = ["quant_flow.tests*"]

[project.scripts]
quant-flow = "quant_flow.main:main"
quant-flow-compare = "quant_flow.reporting.comparison:main"
